version: '3.8'

services:
  # Component 1: Node.js Backend
  backend:
    build: ./backend
    container_name: polling-backend
    restart: always
    # REMOVED PORT MAPPING HERE (Best Practice)
    environment:
      - MONGO_URL=mongodb://mongo:27017/polling
    depends_on:
      - mongo
    networks:
      - polling-network

  # Component 2: MongoDB Database
  mongo:
    image: mongo:6.0
    container_name: polling-db
    restart: always
    volumes:
      - mongo-data:/data/db  # Defines persistence (Q4)
    networks:
      - polling-network

  # Component 3: Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: polling-proxy
    ports:
      - "80:80" # EXTERNAL ACCESS ONLY THROUGH NGINX
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - polling-network

volumes:
  mongo-data:

networks:
  polling-network:
    driver: bridge
